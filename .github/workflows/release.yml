name: build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          [
            { name: windows_x86, arch: x86 },
            { name: windows_x64, arch: x64 },
            { name: windows_arm64, arch: arm64 },
          ]

    name: ${{ matrix.name }}

    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: setup VC-LTL
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: nuget install VC-LTL

      - name: setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: configure
        run: xmake f -a ${{ matrix.arch }} -m release -y

      - name: build
        run: xmake

      - name: package
        run: |
          mkdir -p package
          cp build/release/${{ matrix.arch }}/version.dll package/
          cp config.ini.example package/
          cp config.ini.example.zh-CN package/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: package/
          compression-level: 0

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare release files
        run: |
          mkdir -p release/
          for browser in vivaldi chrome; do
            for arch in x86 x64 arm64; do
              folder="dist/windows_${arch}"
              (cd "$folder" && zip -r "../../release/${browser}-windows-${arch}.zip" .)
            done
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          body: |
            ## Vivaldi++ ${{ github.ref_name }}

            - Native portable mode, startup arguments and boss key for Vivaldi and Chrome.
            - Optional embedded WebUI with Chinese/English, light/dark/system themes and the updated logo.
            - WebUI is **off by default**. Missing `webui` in existing configurations is treated as `0`.
            - To enable it, set `[general] webui=1` in `config.ini` and fully restart every browser instance.
            - About entry: Vivaldi `vivaldi:about`; Chrome `chrome://settings/help`.
            - Multiple instances of the same installation share one service and retain the same port during takeover.
            - Disabling WebUI removes its about entry. Repeated startup does not rewrite unchanged resources.

            ### Packages
            Choose `vivaldi-windows-{x86,x64,arm64}.zip` or `chrome-windows-{x86,x64,arm64}.zip`.
            Both use the shared native DLL and browser-specific resource detection. Install `version.dll` next to the browser executable.
            Configuration examples are included; existing configuration files are not overwritten automatically.

            ### 中文说明
            支持 Vivaldi 和 Chrome，分别提供安装包。网页设置默认关闭；旧配置未写 `webui` 时同样按 `0` 处理。
            在 `config.ini` 的 `[general]` 中设置 `webui=1`，完全退出所有浏览器实例后重新启动，即可从关于页进入。
            网页、Logo 和服务均嵌入 DLL，入口由 C++ 处理，不释放安装脚本或生成备份。
            Chrome 安装包提供本项目的便携化、启动参数和老板键功能，不迁移其他 Chrome++ 项目的标签增强配置。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
