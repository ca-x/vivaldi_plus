name: verify

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Native regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./build/test-tools -Force | Out-Null
          ./tests/run-native.ps1
          ./tests/run-portable-launch.ps1 -BinaryOutput (Join-Path $pwd 'build/test-tools/portable_launch_tests.exe')
          ./tests/run-web-http.ps1
          ./tests/run-web-config.ps1
          ./tests/run-about-patch.ps1
          ./tests/run-gzip.ps1 -BinaryOutput (Join-Path $pwd 'build/test-tools/gzip_tests.exe')
          ./tests/run-chrome-about.ps1 -BinaryOutput (Join-Path $pwd 'build/test-tools/chrome_about_tests.exe')
      - name: Build and exercise lifecycle actions
        shell: pwsh
        run: |
          ./tests/build-lifecycle-host.ps1
          node --test tests/lifecycle.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-lifecycle-host
          path: build/lifecycle-host/*.exe
      - name: Web configuration regression tests
        run: node --test web/tests/*.test.cjs
      - name: Build the embedded settings test host
        shell: pwsh
        run: ./tests/build-web-host.ps1
      - name: Exercise embedded resources and configuration API
        shell: pwsh
        run: |
          $env:VIVALDI_PLUS_WEB_HOST = (Resolve-Path ./build/test-host/web_host.exe).Path
          node --test tests/backend.test.mjs tests/service.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web-test-host
          path: build/test-host/web_host.exe
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-tools
          path: build/test-tools/*.exe

  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Configure
        run: xmake f -a ${{ matrix.arch }} -m release -y
      - name: Build embedded settings DLL
        run: xmake -y
      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-${{ matrix.arch }}
          path: build/release/${{ matrix.arch }}/version.dll
