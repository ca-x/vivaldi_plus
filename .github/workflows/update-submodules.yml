name: Merge verified Detours updates

on:
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve and merge the verified submodule commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f "head=$GITHUB_REPOSITORY_OWNER:$HEAD_BRANCH" -f base=main -f state=open \
            --jq ".[] | select(.user.login == \"dependabot[bot]\" and .head.sha == \"$VERIFIED_SHA\") | .number")
          if [[ -z "$pr" ]]; then
            echo "No open Dependabot PR matches the verified commit."
            exit 0
          fi

          files=$(gh api "repos/$GH_REPO/pulls/$pr/files" --paginate --jq '.[].filename')
          mode=$(gh api "repos/$GH_REPO/git/trees/$VERIFIED_SHA" --jq '.tree[] | select(.path == "detours") | .mode')
          if [[ "$files" != detours || "$mode" != 160000 ]]; then
            echo "Only a Detours submodule pointer update can be merged automatically."
            exit 0
          fi

          gh api --method POST "repos/$GH_REPO/pulls/$pr/reviews" \
            -f event=APPROVE -f "commit_id=$VERIFIED_SHA" \
            -f 'body=Native tests and all three architecture builds passed.' --silent
          gh pr merge "$pr" --merge --match-head-commit "$VERIFIED_SHA" --delete-branch
